# Her push ve pull request'te testler (Node 22 ve 24) ve paketleme denetimi.
# Testler ek paket gerektirmez (node --test, düz ES modülleri).
name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Paket (git archive) üretilebiliyor mu ve içinde test/ belgeler yok mu.
      - run: npm run paketle
      - run: |
          ZIP=$(ls dist/manga-cevirmen-*.zip)
          unzip -l "$ZIP" | grep -q 'manifest.json'
          ! unzip -l "$ZIP" | grep -qE ' (test|docs|scripts)/'
